<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Manrope:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>Démo précurseur — Atelier Synergy</title>
  </head>
  <body>
    <div id="app"></div>
    <!--
      Formulaire statique pour détection Netlify Forms au build.
      Les soumissions runtime passent par fetch (application/x-www-form-urlencoded).
    -->
    <form
      name="tester-responses"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      netlify
      hidden
    >
      <input type="hidden" name="form-name" value="tester-responses" />
      <input name="bot-field" />
      <input name="prenom" />
      <input name="instagram" />
      <input name="tiktok" />
      <input name="telephone" />
      <input name="email" />
      <input name="whatsapp" />
      <input name="session-id" />
      <input name="submitted-at" />
      <input name="demo-version" />
      <textarea name="payload"></textarea>
    </form>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
